/* ================= Drawer ================= */
function openDrawer() {

/* ================= IndexedDB ================= */
const DB_NAME = 'MrabaDramaDB';
const STORE = 'data';
const KEY = 'dramaData';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getData() {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(KEY);
      req.onsuccess = () => {
        const d = req.result;
        if (d) {
          if (!d.series) d.series = [];
          if (!d.news) d.news = [];
          if (!d.sports) d.sports = [];
          resolve(d);
        } else {
          resolve({ series: [], news: [], sports: [] });
        }
      };
      req.onerror = () => resolve({ series: [], news: [], sports: [] });
    });
  } catch (e) {
    console.error('IndexedDB error:', e);
    return { series: [], news: [], sports: [] };
  }
}

/* ================= Object URLs ================= */
const objectURLs = [];
function mediaURL(value) {
  if (!value) return null;
  if (value instanceof Blob) {
    const url = URL.createObjectURL(value);
    objectURLs.push(url);
    return url;
  }
  return value;
}
function revokeAllURLs() {
  objectURLs.forEach(u => { try { URL.revokeObjectURL(u); } catch(e){} });
  objectURLs.length = 0;
}

/* ================= التاريخ ================= */
function formatDate(dateStr) {
  if (!dateStr) {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}/${m}/${day}`;
  }
  return dateStr;
}

function getElapsedTime(item) {
  if (!item) return 'منذ قليل';
  let ts = null;
  if (typeof item.createdAt === 'number' && item.createdAt > 0 && item.createdAt < Date.now() + 60000) {
    ts = item.createdAt;
  } else if (typeof item.timestamp === 'number' && item.timestamp > 0) {
    ts = item.timestamp;
  } else if (typeof item.publishedAt === 'number' && item.publishedAt > 0) {
    ts = item.publishedAt;
  } else if (item.date) {
    ts = parseAnyDate(item.date);
  }

  if (!ts || isNaN(ts)) return 'منذ قليل';

  let diff = Date.now() - ts;
  if (diff < 0) {
    if (Math.abs(diff) < 24 * 3600 * 1000) diff = 0;
    else return 'منذ قليل';
  }

  const sec = Math.floor(diff / 1000);
  const min = Math.floor(sec / 60);
  const hr = Math.floor(min / 60);
  const day = Math.floor(hr / 24);
  const mon = Math.floor(day / 30);
  const yr = Math.floor(mon / 12);

  if (sec < 60) return 'منذ لحظات';
  if (min === 1) return 'منذ دقيقة';
  if (min === 2) return 'منذ دقيقتين';
  if (min < 60) return `منذ ${min} دقيقة`;
  if (hr === 1) return 'منذ ساعة';
  if (hr === 2) return 'منذ ساعتين';
  if (hr < 24) return `منذ ${hr} ساعات`;
  if (day === 1) return 'منذ يوم';
  if (day === 2) return 'منذ يومين';
  if (day < 30) return `منذ ${day} أيام`;
  if (mon === 1) return 'منذ شهر';
  if (mon === 2) return 'منذ شهرين';
  if (mon < 12) return `منذ ${mon} أشهر`;
  if (yr === 1) return 'منذ سنة';
  if (yr === 2) return 'منذ سنتين';
  return `منذ ${yr} سنوات`;
}

function parseAnyDate(str) {
  if (!str) return null;
  const arabicNums = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  let s = String(str).replace(/[٠-٩]/g, d => arabicNums.indexOf(d));
  s = s.replace(/[\u200E\u200F\u202A-\u202E]/g, '').trim();

  const parts = s.match(/(\d{1,4})\D+(\d{1,4})\D+(\d{1,4})/);
  if (parts) {
    let a = parseInt(parts[1]), b = parseInt(parts[2]), c = parseInt(parts[3]);
    let year, month, day;

    if (a > 31) { year = a; month = b; day = c; }
    else if (c > 31) {
      year = c;
      if (a > 12) { day = a; month = b; }
      else if (b > 12) { day = b; month = a; }
      else { day = a; month = b; }
    } else {
      year = new Date().getFullYear();
      day = a; month = b;
    }

    if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
      return new Date(year, month - 1, day, 12, 0, 0).getTime();
    }
  }
  if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) {
    const d = new Date(s);
    if (!isNaN(d.getTime())) return d.getTime();
  }
  const d2 = new Date(s);
  if (!isNaN(d2.getTime())) return d2.getTime();
  return null;
}

function excerpt(text, maxLen) {
  if (!text) return '';
  const clean = String(text).replace(/\s+/g, ' ').trim();
  if (clean.length <= maxLen) return clean;
  return clean.substring(0, maxLen).trim() + '...';
}

        <button class="vp-btn" id="vpFullBtn" aria-label="ملء الشاشة">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </div>
  </div>`;
}

function initModernPlayer() {
  const player = document.getElementById('vplayer');
  const video = document.getElementById('vpVideo');
  const modalContent = document.getElementById('modalContent');
  if (!player || !video) return;

  const playBtn = document.getElementById('vpPlayBtn');
  const playIcon = document.getElementById('vpPlayIcon');
  const centerPlay = document.getElementById('vpCenterPlay');
  const muteBtn = document.getElementById('vpMuteBtn');
  const volumeIcon = document.getElementById('vpVolumeIcon');
  const volume = document.getElementById('vpVolume');
  const currentTime = document.getElementById('vpCurrent');
  const duration = document.getElementById('vpDuration');
  const progressWrap = document.getElementById('vpProgressWrap');
  const played = document.getElementById('vpPlayed');
  const buffered = document.getElementById('vpBuffered');
  const thumb = document.getElementById('vpThumb');
  const tooltip = document.getElementById('vpTooltip');
  const fullBtn = document.getElementById('vpFullBtn');
  const loader = document.getElementById('vpLoader');
  const speedBtn = document.getElementById('vpSpeedBtn');
  const speedMenu = document.getElementById('vpSpeedMenu');

  let isDragging = false;
  let controlsTimeout = null;

  const PLAY_SVG = '<path d="M8 5v14l11-7z"/>';
  const PAUSE_SVG = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  const VOL_HIGH = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  const VOL_MUTE = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

  function updatePlayIcon() {
    if (video.paused) {
      playIcon.innerHTML = PLAY_SVG;
      player.classList.add('paused');
      player.classList.remove('playing');
    } else {
      playIcon.innerHTML = PAUSE_SVG;
      player.classList.remove('paused');
      player.classList.add('playing');
    }
  }

  function fmt(t) {
    if (!isFinite(t) || isNaN(t)) return '0:00';
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = Math.floor(t % 60);
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function updateProgress() {
    if (!video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    played.style.width = pct + '%';
    thumb.style.left = pct + '%';
    currentTime.textContent = fmt(video.currentTime);

    if (video.buffered.length > 0) {
      const bufEnd = video.buffered.end(video.buffered.length - 1);
      buffered.style.width = (bufEnd / video.duration * 100) + '%';
    }
  }

  function togglePlay() {
    if (video.paused) video.play().catch(e => console.log(e));
    else video.pause();
  }

  function showControls() {
    player.classList.remove('idle');
    if (modalContent) modalContent.classList.remove('player-idle');
    clearTimeout(controlsTimeout);
    if (!video.paused) {
      controlsTimeout = setTimeout(() => {
        player.classList.add('idle');
        if (modalContent) modalContent.classList.add('player-idle');
      }, 4000);
    }
  }

  video.addEventListener('play', () => {
    updatePlayIcon();
    showControls();
  });
  video.addEventListener('pause', () => {
    updatePlayIcon();
    showControls();
    clearTimeout(controlsTimeout);
    player.classList.remove('idle');
    if (modalContent) modalContent.classList.remove('player-idle');
  });
  video.addEventListener('timeupdate', updateProgress);
  video.addEventListener('progress', updateProgress);
  video.addEventListener('loadedmetadata', () => {
    duration.textContent = fmt(video.duration);
    updateProgress();
  });
  video.addEventListener('waiting', () => loader.classList.add('show'));
  video.addEventListener('playing', () => loader.classList.remove('show'));
  video.addEventListener('canplay', () => loader.classList.remove('show'));
  video.addEventListener('ended', () => {
    player.classList.add('paused');
    updatePlayIcon();
    showControls();
  });

  playBtn.addEventListener('click', e => {
    e.stopPropagation();
    togglePlay();
    showControls();
  });
  centerPlay.addEventListener('click', e => {
    e.stopPropagation();
    togglePlay();
    showControls();
  });

  video.addEventListener('click', e => {
    e.stopPropagation();
    if (video.paused) {
      video.play().catch(() => {});
      showControls();
    } else {
      showControls();
    }
  });

  function seekFromEvent(e) {
    const rect = progressWrap.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const pct = Math.max(0, Math.min(1, x / rect.width));
    if (video.duration) video.currentTime = pct * video.duration;
  }

  progressWrap.addEventListener('mousedown', e => {
    isDragging = true;
    seekFromEvent(e);
    video.pause();
    showControls();
  });
  document.addEventListener('mousemove', e => {
    if (isDragging) seekFromEvent(e);
    const rect = progressWrap.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x >= 0 && x <= rect.width) {
      const pct = x / rect.width;
      tooltip.style.left = (pct * 100) + '%';
      if (video.duration) tooltip.textContent = fmt(pct * video.duration);
    }
  });
  document.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      if (video.currentTime < video.duration) video.play().catch(()=>{});
    }
  });

  progressWrap.addEventListener('touchstart', e => {
    isDragging = true;
    seekFromEvent(e);
    showControls();
  }, { passive: true });
  progressWrap.addEventListener('touchmove', e => {
    if (isDragging) seekFromEvent(e);
  }, { passive: true });
  progressWrap.addEventListener('touchend', () => {
    isDragging = false;
  });

  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    video.muted = !video.muted;
    updateVolumeIcon();
    showControls();
  });
  volume.addEventListener('input', () => {
    video.volume = parseFloat(volume.value);
    video.muted = video.volume === 0;
    updateVolumeIcon();
  });
  function updateVolumeIcon() {
    if (video.muted || video.volume === 0) {
      volumeIcon.innerHTML = VOL_MUTE;
      volume.value = 0;
    } else {
      volumeIcon.innerHTML = VOL_HIGH;
      volume.value = video.volume;
    }
  }

  fullBtn.addEventListener('click', e => {
    e.stopPropagation();
    const el = player;
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    showControls();
  });

  speedBtn.addEventListener('click', e => {
    e.stopPropagation();
    speedMenu.classList.toggle('show');
    showControls();
  });
  speedMenu.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const s = parseFloat(b.dataset.speed);
      video.playbackRate = s;
      speedBtn.textContent = s + 'x';
      speedMenu.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      speedMenu.classList.remove('show');
      showControls();
    });
  });
  document.addEventListener('click', () => speedMenu.classList.remove('show'));

  player.addEventListener('mousemove', showControls);
  player.addEventListener('touchstart', showControls, { passive: true });

  document.addEventListener('keydown', e => {
    if (!document.getElementById('vplayer')) return;
    if (document.getElementById('modal').classList.contains('show')) {
      if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); showControls(); }
      if (e.key === 'ArrowRight') { video.currentTime += 5; showControls(); }
      if (e.key === 'ArrowLeft') { video.currentTime -= 5; showControls(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); updateVolumeIcon(); showControls(); }
      if (e.key === 'ArrowDown') { e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); updateVolumeIcon(); showControls(); }
      if (e.key === 'm') { video.muted = !video.muted; updateVolumeIcon(); showControls(); }
      if (e.key === 'f') { fullBtn.click(); }
    }
  });

  updatePlayIcon();
  updateVolumeIcon();

  video.play().then(() => {
    showControls();
  }).catch(() => {
    player.classList.add('paused');
  });

  player.classList.add('paused');
}

/* ================= قسم أخبار / رياضة ================= */
function renderNewsLikeSection(dataArr, badgeText, type) {
  let html = '';
  if (!dataArr || dataArr.length === 0) {
    html += `<div class="empty-state">لا توجد محتويات منشورة حالياً</div>`;
    return html;
  }

  const latest = dataArr[0];
  const dateStr = formatDate(latest.date);
  const latestImg = mediaURL(latest.image) || 'https://via.placeholder.com/1200x600/1a1f29/e11d2e?text=مربع+الدراما';
  const latestExcerpt = excerpt(latest.content, 220);

  html += `
  <div class="hero-section">
    <div class="hero-card" onclick="openItem('${type}', 0)">
      <div class="hero-image-wrap">
        <span class="hero-date-text">${dateStr}</span>
        <img src="${latestImg}" class="hero-image" alt="${latest.title}">
      </div>
      <div class="hero-content">
        <div class="hero-badge">${badgeText}</div>
        <h1 class="hero-title">${latest.title}</h1>
        ${latestExcerpt ? `<p class="hero-excerpt">${latestExcerpt}</p>` : ''}
        <div class="hero-time">${getElapsedTime(latest)}</div>
      </div>
    </div>
  </div>`;

  if (dataArr.length > 1) {
    const sectionTitle = type === 'news' ? 'آخر الأخبار' : 'آخر الأخبار الرياضية';
    html += `<h2 class="section-title">${sectionTitle}</h2><div class="news-list">`;
    dataArr.slice(1).forEach((n, i) => {
      const nDate = formatDate(n.date);
      const nImg = mediaURL(n.image) || 'https://via.placeholder.com/400x300/1a1f29/e11d2e?text=خبر';
      const nExcerpt = excerpt(n.content, 140);
      html += `
      <div class="news-item" onclick="openItem('${type}', ${i + 1})">
        <div class="news-item-img-wrap">
          <span class="news-item-date">${nDate}</span>
          <img src="${nImg}" class="news-item-img" alt="${n.title}">
        </div>
        <div class="news-item-body">
          <div class="news-item-badge">${badgeText}</div>
          <h3 class="news-item-title">${n.title}</h3>
          ${nExcerpt ? `<p class="news-item-excerpt">${nExcerpt}</p>` : ''}
          <div class="news-item-time">${getElapsedTime(n)}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  return html;
}

/* ================= الرسم ================= */
let currentData = { series: [], news: [], sports: [] };

async function render(section = 'series') {
  revokeAllURLs();
  const data = await getData();
  currentData = data;
  let html = '';

  if (section === 'news') html += renderNewsLikeSection(data.news, 'خبر عاجل', 'news');
  if (section === 'sports') html += renderNewsLikeSection(data.sports, 'خبر رياضي', 'sports');

  if (section === 'series') {
    if (data.series.length === 0) {
      html += `<div class="empty-state">لا توجد مسلسلات منشورة حالياً</div>`;
    } else {
      html += `<div class="series-grid">`;
      data.series.forEach((s, i) => {
        let mediaHTML = '';
        if (s.video) {
          const videoUrl = mediaURL(s.video);
          mediaHTML = `<video class="series-video" src="${videoUrl}#t=0.1" muted playsinline preload="metadata"></video>
                       <div class="play-overlay"><span>▶</span></div>`;
        } else if (s.image) {
          const sImg = mediaURL(s.image);
          mediaHTML = `<img src="${sImg}" class="series-img" alt="${s.title}">`;
        } else {
          mediaHTML = `<img src="https://via.placeholder.com/480x270/1a1f29/e11d2e?text=مسلسل" class="series-img" alt="${s.title}">`;
        }

        const sDate = formatDate(s.date);
        const elapsed = getElapsedTime(s);
        const sDesc = excerpt(s.desc, 100);

        html += `
        <div class="series-card" onclick="openItem('series', ${i})">
          <div class="series-media">
            <span class="series-date-text">${sDate}</span>
            ${mediaHTML}
          </div>
          <div class="series-info">
            <h3 class="series-name">${s.title}</h3>
            ${sDesc ? `<p class="series-desc">${sDesc}</p>` : ''}
            <div class="series-meta">
              <span class="series-badge">${s.genre || 'دراما'}</span>
              <span>${s.year || '2026'}</span>
            </div>
            <div class="series-time">${elapsed}</div>
          </div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  document.getElementById('mainContent').innerHTML = html;
}

/* ================= فتح عنصر ================= */
function openItem(type, index) {
  const item = currentData[type][index];
  if (!item) return;
  let html = '';

  if (type === 'news' || type === 'sports') {
    const itemDate = formatDate(item.date);
    const badgeText = type === 'news' ? 'خبر عاجل' : 'خبر رياضي';
    const imgUrl = mediaURL(item.image) || 'https://via.placeholder.com/800x400/1a1f29/e11d2e?text=مربع+الدراما';
    html = `
      <div style="position: relative;">
        <span class="hero-date-text" style="top: 15px; right: 18px;">${itemDate}</span>
        <img src="${imgUrl}" class="modal-media">
      </div>
      <div class="modal-body">
        <div class="hero-badge" style="margin-bottom:12px;">${badgeText}</div>
        <h2 class="modal-title">${item.title}</h2>
        <div class="modal-text">${(item.content || '').replace(/\n/g, '<br>')}</div>
      </div>`;
  } else {
    let mediaHTML = '';
    if (item.video) {
      const videoUrl = mediaURL(item.video);
      const posterUrl = item.image ? mediaURL(item.image) : '';
      mediaHTML = buildModernPlayer(videoUrl, posterUrl);
    } else {
      const imgUrl = mediaURL(item.image) || 'https://via.placeholder.com/800x400/1a1f29/e11d2e?text=مربع+الدراما';
      mediaHTML = `<img src="${imgUrl}" class="modal-media">`;
    }

    html = `
      ${mediaHTML}
      <div class="modal-body">
        <h2 class="modal-title">${item.title}</h2>
        <div style="margin-bottom: 22px; display: flex; gap: 12px; align-items: center;">
          <span class="series-badge">${item.genre || 'دراما'}</span>
          <span style="color: var(--text-muted);">${item.year || '2026'}</span>
        </div>
        <div class="modal-text">${item.desc ? item.desc.replace(/\n/g, '<br>') : 'لا يوجد وصف متاح.'}</div>
      </div>`;
  }
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('show');
  document.body.style.overflow = 'hidden';

  if (type === 'series' && item.video) {
    setTimeout(initModernPlayer, 50);
  }
}

/* ================= إغلاق المودال ================= */
function closeModal() {
  const modal = document.getElementById('modal');
  const modalContent = document.getElementById('modalContent');
  modal.classList.remove('show');
  if (modalContent) modalContent.classList.remove('player-idle');
  document.body.style.overflow = 'auto';
  const video = modal.querySelector('video');
  if (video) { video.pause(); video.currentTime = 0; }
  const vpVideo = modal.querySelector('#vpVideo');
  if (vpVideo) { vpVideo.pause(); vpVideo.currentTime = 0; }
  setTimeout(() => { document.getElementById('modalBody').innerHTML = ''; }, 300);
}

/* زر الإغلاق X */
(function setupCloseButton() {
  const closeBtn = document.getElementById('modalCloseBtn');
  if (!closeBtn) return;

  const handleClose = (e) => {
    e.preventDefault();
    e.stopPropagation();
    closeModal();
  };

  closeBtn.addEventListener('click', handleClose, true);
  closeBtn.addEventListener('touchend', handleClose, { capture: true, passive: false });
})();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('modal').classList.contains('show')) closeModal();
    if (document.getElementById('drawer').classList.contains('show')) closeDrawer();
  }
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

/* ================= التنقل ================= */
document.querySelectorAll('.nav-list a').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('.nav-list a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    render(a.dataset.section);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

/* ================= مزامنة ================= */
try {
  const channel = new BroadcastChannel('mrabaDrama_sync');
  channel.onmessage = (e) => {
    if (e.data === 'data-updated') {
      const active = document.querySelector('.nav-list a.active');
      if (active) render(active.dataset.section);
    }
  };
} catch (e) {}

setInterval(async () => {
  const active = document.querySelector('.nav-list a.active');
  if (active) render(active.dataset.section);
}, 5000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    const active = document.querySelector('.nav-list a.active');
    if (active) render(active.dataset.section);
  }
});

render('series');
</script>
